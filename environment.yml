# Create with:  conda env create -f environment.yml
# Then, from the repo root:  pip install -e .
name: jbypass
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu132
      - torch==2.15.0+cu132
      - transformers==5.23.0
      - peft==0.21.3
      - accelerate==1.15.0
      - numpy==2.5.4
      - pyyaml==6.0.3
      - pytest==9.2.0
      - datasets==5.2.0
      - gradio==6.32.0
      - jlens @ git+https://github.com/anthropics/jacobian-lens@581d398613e5602a5af361e1c34d3a92ea82ba8e

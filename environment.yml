# Create with:  conda env create -f environment.yml
# Then, from the repo root:  pip install -e .
name: jbypass
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu132
      - torch==2.15.0+cu132
      - transformers==5.23.0
      - peft==0.21.3
      - accelerate==1.15.0
      - numpy==2.5.4
      - pyyaml==6.0.3
      - pytest==9.2.0

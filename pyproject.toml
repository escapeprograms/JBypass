[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jbypass"
version = "0.1.0"
description = "J-Bypassing: can a model learn while under J-lens ablations?"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["jbypass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

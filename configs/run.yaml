# Run configuration. Switching models = change `model` (or pass --model to the scripts).
model: qwen3-1.7b
profiles_dir: models             # relative to this file's folder

generation:
  max_new_tokens: 16             # answers are short; generation has no KV cache

lora:
  r: 16
  alpha: 32
  dropout: 0.05

train:                           # sized for an 8 GB GPU; raise batch_size on a bigger one
  learning_rate: 2.0e-4
  batch_size: 2
  steps: 500                       # smoke-test length; raise for real runs
  seed: 0

# Optional `jspace:` section: overrides of JSpaceConfig fields (jspace/config.py), e.g.
# band_layers: [first, last] (inclusive; replaces the band_start/band_end fractions),
# clamp_z, readout_stats_dir (relative to this file's folder). Unknown keys raise.
# None here, so the defaults apply (band = layers 11-26 on qwen3-1.7b, stats in stats/ under
# the working directory). configs/exp3.yaml is an example.
